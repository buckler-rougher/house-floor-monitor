<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Generate Short Link</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 20px;
		}

		.container {
			background: white;
			border-radius: 16px;
			box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
			max-width: 500px;
			width: 100%;
			padding: 40px;
		}

		h1 {
			font-size: 28px;
			margin-bottom: 10px;
			color: #1a1a1a;
		}

		.subtitle {
			color: #666;
			margin-bottom: 30px;
			font-size: 14px;
		}

		.form-group {
			margin-bottom: 20px;
		}

		label {
			display: block;
			font-weight: 600;
			margin-bottom: 8px;
			color: #333;
			font-size: 14px;
		}

		input {
			width: 100%;
			padding: 12px;
			border: 2px solid #e0e0e0;
			border-radius: 8px;
			font-size: 14px;
			transition: border-color 0.2s;
		}

		input:focus {
			outline: none;
			border-color: #667eea;
		}

		button {
			width: 100%;
			padding: 12px;
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			color: white;
			border: none;
			border-radius: 8px;
			font-weight: 600;
			font-size: 14px;
			cursor: pointer;
			transition: transform 0.1s, box-shadow 0.2s;
		}

		button:hover {
			box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
		}

		button:active {
			transform: scale(0.98);
		}

		button:disabled {
			opacity: 0.6;
			cursor: not-allowed;
		}

		.result {
			margin-top: 30px;
			padding: 20px;
			background: #f5f5f5;
			border-radius: 8px;
			display: none;
		}

		.result.show {
			display: block;
		}

		.result-label {
			font-size: 12px;
			color: #666;
			margin-bottom: 8px;
			text-transform: uppercase;
			letter-spacing: 0.5px;
		}

		.result-url {
			font-size: 16px;
			font-weight: 600;
			color: #667eea;
			word-break: break-all;
			margin-bottom: 12px;
		}

		.copy-btn {
			background: #667eea;
			padding: 8px 16px;
			font-size: 13px;
			width: auto;
		}

		.error {
			color: #e74c3c;
			font-size: 13px;
			margin-top: 10px;
		}

		.success {
			color: #27ae60;
			font-size: 13px;
			margin-top: 10px;
		}
	</style>
</head>
<body>
	<div class="container">
		<h1>Generate Link</h1>
		<p class="subtitle">Create a short link in seconds</p>

		<form id="generateForm">
			<div class="form-group">
				<label for="url">URL to shorten</label>
				<input
					type="url"
					id="url"
					placeholder="https://example.com/very/long/url"
					required
				>
			</div>

			<div class="form-group">
				<label for="slug">Custom slug (optional)</label>
				<input
					type="text"
					id="slug"
					placeholder="my-link"
				>
			</div>

			<button type="submit">Generate Link</button>

			<div id="message"></div>
		</form>

		<div class="result" id="result">
			<div class="result-label">Your short link</div>
			<div class="result-url" id="resultUrl"></div>
			<button class="copy-btn" id="copyBtn">Copy to clipboard</button>
		</div>
	</div>

	<script>
		const form = document.getElementById('generateForm');
		const urlInput = document.getElementById('url');
		const slugInput = document.getElementById('slug');
		const resultDiv = document.getElementById('result');
		const resultUrl = document.getElementById('resultUrl');
		const messageDiv = document.getElementById('message');
		const copyBtn = document.getElementById('copyBtn');

		form.addEventListener('submit', async (e) => {
			e.preventDefault();

			const url = urlInput.value.trim();
			const slug = slugInput.value.trim();

			if (!url) return;

			const submitBtn = form.querySelector('button[type="submit"]');
			submitBtn.disabled = true;
			submitBtn.textContent = 'Creating...';
			messageDiv.innerHTML = '';

			try {
				const response = await fetch('https://openshort-link-generator.pmzzg4fpnj.workers.dev/api/generate-link', {
					method: 'POST',
					headers: {
						'Content-Type': 'application/json'
					},
					body: JSON.stringify({
						url: url,
						slug: slug || undefined
					})
				});

				const data = await response.json();

				if (!response.ok) {
					throw new Error(data.error || 'Failed to create link');
				}

				const shortUrl = `https://s.evanhollander.org/${data.slug}`;
				resultUrl.textContent = shortUrl;
				resultDiv.classList.add('show');

				urlInput.value = '';
				slugInput.value = '';

				messageDiv.innerHTML = '<div class="success">✓ Link created</div>';
			} catch (error) {
				messageDiv.innerHTML = `<div class="error">✗ ${error.message}</div>`;
				resultDiv.classList.remove('show');
			} finally {
				submitBtn.disabled = false;
				submitBtn.textContent = 'Generate Link';
			}
		});

		copyBtn.addEventListener('click', () => {
			const text = resultUrl.textContent;
			navigator.clipboard.writeText(text).then(() => {
				const originalText = copyBtn.textContent;
				copyBtn.textContent = 'Copied!';
				setTimeout(() => {
					copyBtn.textContent = originalText;
				}, 2000);
			});
		});
	</script>
</body>
</html>
