# Have the sources our explanations cite been revised since we wrote from them?
#
# WHY THIS EXISTS
# Each (?) popup and panel summary is "Summary generated by AI from CRS Report X (year)", written from ONE edition of
# a report. CRS revises its reports, and a revision can change what the board says (the special-order policy text
# was found contradicting its own source). dev/check-sources.mjs asks the Congress.gov API for each cited report's
# current version and fails if it is newer than the one cited, so the failing run (GitHub emails whoever last edited
# this schedule) is the prompt to re-read it, update the summary if needed, and bump the link and year.
#
# KEY: add a repository secret CONGRESS_API_KEY (free from api.congress.gov/sign-up, no card; the Worker already
# uses one). Without it the check falls back to DEMO_KEY, which a shared runner exhausts after a call or two, and it
# then WARNS that it could not look; a warning does not fail the run.
#
# WEEKLY, not daily: CRS revises a report a few times a year, and a daily failure would be a daily email until
# someone re-reads it.
name: Source revisions

on:
  schedule:
    - cron: '41 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check the cited sources
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
        run: node dev/check-sources.mjs
