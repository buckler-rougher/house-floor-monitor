# Measure how long a floor action takes to reach the board.
#
# WHY THIS RUNS UNATTENDED
# The board picks its mode from the Clerk's proceedings feed, and that feed is
# slow during morning business — which is also when the events are shortest. A
# prayer and pledge are over in two minutes, so a feed that lags does not report
# them late, it misses them, and the board sits in the wrong mode through the one
# part of the day it could have been right.
#
# Nobody has measured how slow. Measuring it needs someone polling during a live
# session, which is not a thing a person is going to sit and do, so it runs here.
#
# Two sources, answering different questions. clerk.house.gov is the Clerk's own
# delay and is not ours to fix. Our /api/proceedings adds the worker's cache TTL
# on top; that gap is the part we control, and the summary prints both.
#
# A run on a day with no session finds nothing new and honestly reports no live
# observations, so this is harmless on recesses and weekends.
name: Proceedings publication lag

on:
  schedule:
    # 09:07 UTC, which is NOT when this is meant to run.
    #
    # The first three scheduled runs all reported no live observations, and the
    # reason was not that the House was quiet. GitHub started them 4.2, 5.4 and
    # 4.4 hours after the 13:30 cron. The 21 Sep pro forma convened at 14:29 UTC
    # and adjourned at 14:33, four minutes; that day's run began at 18:51. The
    # poller has never once been awake while the House was sitting.
    #
    # Scheduled runs queue on shared infrastructure and :00 and :30 are the worst
    # slots to ask for. So: an odd minute, and early enough that the observed
    # delay lands the start before the House convenes rather than after it. At
    # 09:07 plus the 2.5-5.4h seen so far, the job begins between 11:37 and 14:31
    # UTC and polls for four and a half hours from there.
    #
    # If the delay grows again this will silently stop working, which is exactly
    # how it failed the first time, so the run now prints how late it was.
    #
    # Two starts, because the House does not keep to one hour. The 21 Sep pro
    # forma convened 14:29 UTC; the 24 Sep one is called for 18:30 UTC. A single
    # window cannot cover both once GitHub has moved the start by an unknown
    # four-ish hours. The morning start covers roughly 11:37-19:01 UTC and the
    # afternoon one 14:37-22:01, so between them any convene from mid-morning to
    # early evening ET falls inside a live poll. 12:07 rather than 13:07 because
    # at 13:07 the worst observed delay would start the run at 18:31, one minute
    # after tomorrow's 18:30 convene -- no margin at all for the session this was
    # rescheduled to catch.
    - cron: '7 9 * * 1-5'
    - cron: '7 12 * * 1-5'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'How long to poll for'
        required: false
        default: '270'
      interval:
        description: 'Seconds between polls'
        required: false
        default: '20'

permissions:
  contents: read

# Deliberately NOT serialised. With a concurrency group the afternoon run would
# queue behind the morning one until it finished, which on a 270-minute window
# means it would start hours after its own delay had already been spent -- and
# the whole point of the second start is that it is awake at a different time.
# Overlapping pollers are harmless: they observe independently and each writes
# its own artifact.

jobs:
  measure:
    runs-on: ubuntu-latest
    # Generous margin over the poll window so the summary always gets written.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - name: How late did this start?
        # Reads the cron that actually fired. Hardcoding 09:07 made the
        # afternoon run report itself 477 minutes late when it was 297 late
        # against its own 12:07 schedule.
        env:
          SCHED: ${{ github.event.schedule }}
        run: |
          now=$(date -u +%s)
          if [ -n "$SCHED" ]; then
            m=$(echo "$SCHED" | awk '{print $1}')
            h=$(echo "$SCHED" | awk '{print $2}')
            want=$(date -u -d "today ${h}:${m}" +%s)
            printf 'cron %s: due %02d:%02d UTC, started %s UTC, late by %d min\n' \
              "$SCHED" "$h" "$m" "$(date -u +%H:%M)" "$(( (now - want) / 60 ))" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "manual run, started $(date -u +%H:%M) UTC" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Poll the proceedings feed
        # Dispatch inputs go through env, not straight into the run block. An
        # expression pasted into a script is substituted before bash sees it,
        # so the value becomes part of the command; through env it stays a
        # value. Both are numbers here, but the shape is the point.
        env:
          MINUTES: ${{ inputs.minutes || '270' }}
          INTERVAL: ${{ inputs.interval || '20' }}
        run: >-
          node dev/proceedings-lag.mjs
          "--minutes=$MINUTES"
          "--interval=$INTERVAL"
          --out=proceedings-lag.jsonl

      - name: Keep the raw observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proceedings-lag-${{ github.run_id }}
          path: proceedings-lag.jsonl
          if-no-files-found: ignore
          retention-days: 90
