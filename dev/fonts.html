<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>Mono candidates — House Floor</title>
<style>
  /* Candidates are served from the CDN exactly as production would load them. */
  @font-face{font-family:'JetBrains Mono';src:url('https://cdn.evanhollander.org/fonts/JetBrainsMonoVF.woff2') format('woff2');font-weight:100 800;font-display:swap}
  @font-face{font-family:'Fira Code';src:url('https://cdn.evanhollander.org/fonts/FiraCodeVF.woff2') format('woff2');font-weight:300 700;font-display:swap}
  @font-face{font-family:'Roboto Mono';src:url('https://cdn.evanhollander.org/fonts/RobotoMonoVF.woff2') format('woff2');font-weight:100 700;font-display:swap}
  @font-face{font-family:'Source Code Pro';src:url('https://cdn.evanhollander.org/fonts/SourceCodeProVF.woff2') format('woff2');font-weight:200 900;font-display:swap}
  @font-face{font-family:'IBM Plex Mono';src:url('https://cdn.evanhollander.org/fonts/IBMPlexMono-400.woff2') format('woff2');font-weight:400;font-display:swap}
  @font-face{font-family:'IBM Plex Mono';src:url('https://cdn.evanhollander.org/fonts/IBMPlexMono-500.woff2') format('woff2');font-weight:500;font-display:swap}
  @font-face{font-family:'IBM Plex Mono';src:url('https://cdn.evanhollander.org/fonts/IBMPlexMono-600.woff2') format('woff2');font-weight:600;font-display:swap}
  @font-face{font-family:'IBM Plex Mono';src:url('https://cdn.evanhollander.org/fonts/IBMPlexMono-700.woff2') format('woff2');font-weight:700;font-display:swap}
  @font-face{font-family:'Space Mono';src:url('https://cdn.evanhollander.org/fonts/SpaceMono-400.woff2') format('woff2');font-weight:400;font-display:swap}
  @font-face{font-family:'Space Mono';src:url('https://cdn.evanhollander.org/fonts/SpaceMono-700.woff2') format('woff2');font-weight:700;font-display:swap}

  :root{--bg:#0d1117;--card:#0f1720;--line:#233044;--text:#e6edf3;--muted:#9aa6b2;
        --blue:#58a6ff;--green:#3fb950;--red:#ff4d4f;--amber:#d29922}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
  header{position:sticky;top:0;z-index:5;padding:14px 20px;background:rgba(13,17,23,.95);
         backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  h1{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.5px}
  label{color:var(--muted);font-size:12px;display:flex;gap:6px;align-items:center}
  .grid{display:grid;gap:18px;padding:20px;grid-template-columns:repeat(auto-fill,minmax(430px,1fr))}
  .card{border:1px solid var(--line);border-radius:10px;background:var(--card);overflow:hidden}
  .card h2{margin:0;padding:9px 14px;border-bottom:1px solid var(--line);font-size:12px;
           text-transform:uppercase;letter-spacing:.5px;display:flex;justify-content:space-between}
  .card h2 .size{color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0}
  .body{padding:14px}
  /* Below: real strings from the site, at the real token sizes it uses. */
  .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:3px 0}
  .lbl{font-size:8px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600}
  .lbl-md{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600}
  .tally{font-size:48px;font-weight:700;line-height:1}
  .pct{font-size:12px;color:var(--muted)}
  .billid{font-size:13px;font-weight:700}
  .action{font-size:11px;color:var(--blue)}
  .clock{font-size:16px;font-weight:600;letter-spacing:1px}
  .status{font-size:9px;text-transform:uppercase;letter-spacing:1px;font-weight:700}
  .mini{font-size:10px;color:var(--muted)}
  .yea{color:var(--green)}.nay{color:var(--red)}.amb{color:var(--amber)}
  hr{border:0;border-top:1px solid var(--line);margin:11px 0}
  .zero{font-size:15px;letter-spacing:1px}
</style></head><body>
<header>
  <h1>Mono candidates</h1>
  <label>size <input id="scale" type="range" min="80" max="130" value="100"> <span id="scalev">100%</span></label>
  <label><input id="only" type="checkbox"> one column</label>
  <span id="status" style="color:var(--muted)"></span>
</header>
<div class="grid" id="grid"></div>
<script>
const FONTS = ['JetBrains Mono','IBM Plex Mono','Fira Code','Roboto Mono','Source Code Pro','Space Mono','Menlo'];
// Menlo is the control: it is what the site renders as today, since every family
// in the current stack falls back.
const sample = f => `
  <div class="row"><span class="lbl">Happening Now</span><span class="lbl">Source: DomeWatch</span></div>
  <div class="row"><span class="billid">H.R. 4795</span><span class="action">Passed (Roll Call 295): 237-169</span></div>
  <div class="row"><span class="billid">H. Res. 1499</span><span class="action">Passed 210-208</span></div>
  <hr>
  <div class="row" style="align-items:flex-end">
    <div><div class="lbl yea">Yea</div><div class="tally yea">237</div><div class="pct">58.4%</div></div>
    <div><div class="lbl">Present</div><div class="tally">0</div><div class="pct">0.0%</div></div>
    <div><div class="lbl nay">Nay</div><div class="tally nay">169</div><div class="pct">41.6%</div></div>
  </div>
  <hr>
  <div class="row"><span class="lbl-md">Subject to a Rule</span><span class="status amb">Vote Requested</span></div>
  <div class="row"><span class="mini">DCA · Ronald Reagan National</span><span class="status" style="color:var(--red)">Ground Stop</span></div>
  <div class="row"><span class="clock">14:30:00</span><span class="clock">18:30:00</span></div>
  <div class="row"><span class="mini">3 minutes 34 seconds left · 52 not voted</span></div>
  <div class="zero">0O 1lI · 8B 5S 2Z · rn m · () [] {}</div>`;
const grid=document.getElementById('grid'), scale=document.getElementById('scale');
function render(){
  grid.innerHTML = FONTS.map(f=>`<figure class="card" style="margin:0">
      <h2><span>${f}</span><span class="size">${f==='Menlo'?'current (fallback)':'candidate'}</span></h2>
      <div class="body" style="font-family:'${f}',monospace">${sample(f)}</div></figure>`).join('');
}
scale.oninput = () => { document.documentElement.style.fontSize = scale.value+'%';
  document.getElementById('scalev').textContent = scale.value+'%'; };
document.getElementById('only').onchange = e => {
  grid.style.gridTemplateColumns = e.target.checked ? '1fr' : 'repeat(auto-fill,minmax(430px,1fr))'; };
render();
document.fonts.ready.then(()=>{
  const cv=document.createElement('canvas').getContext('2d');
  const w=f=>{cv.font=`14px "${f}", serif`;return cv.measureText('WMilg0O@#1lI').width;};
  const base=w('__nope__');
  document.getElementById('status').textContent =
    FONTS.map(f=>`${f}: ${w(f)!==base?'loaded':'FAILED'}`).join('  ·  ');
});
</script></body></html>
